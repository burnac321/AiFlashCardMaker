<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create an account</title>
<link rel="stylesheet" type="text/css" href="/styles/global.css">
<link rel="stylesheet" type="text/css" href="/styles/signup.css">
</head>

<body>
<form name="signupForm">
    <h1>Create an account<br>to use <b>Flash Card AI Maker</b></h1>

    <label>Full Name</label>
    <input 
        type="text" 
        name="userNames" 
        placeholder="IRAKOZE Arsene"
        required
        minlength="3"
        title="Enter at least 3 characters"
    >

    <label>Phone Number</label>
    <input 
        type="tel" 
        name="userPhoneNumber" 
        placeholder="078XXXXXXXX"
        title="Enter a valid Rwanda number (e.g. 0781234567)"
        required
    >

    <label>Email</label>
    <input 
        type="email" 
        name="userEmail" 
        placeholder="email@gmail.com"
        required
    >

    <label>Password</label>
    <input 
        type="password" 
        name="userPassword"
        placeholder="***********"
        required
        minlength="6"
        title="At least 6 characters, including a letter and a number"
    >

    <label>Confirm Password</label>
    <input 
        type="password" 
        name="confirmPassword"
        placeholder="********"
        required
        minlength="6"
    >

    <button name="signupButton">Create Account</button>
    <p id="signupMessage"></p>

    <div class="login-link">
        <p>Already have an account? <a href="login.html" target="_blank">Login</a></p>
    </div>
</form>
<script src="/js/signup.js"></script>
</body>
</html>
