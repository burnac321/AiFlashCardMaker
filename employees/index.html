<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Table Records data</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>

<div class="container">
  <header>
    <h1>👔 Employee Records</h1>
  </header>

  <div class="table-wrapper">
    <table id="employeeTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Employee Name</th>
          <th>Salary (RWF)</th>
          <th>Job Title</th>
          <th>Tax (RWF)</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- rows will be inserted here -->
      </tbody>
    </table>
  </div>

  <div class="summary" id="summary">
    <!-- summary stats will be shown here -->
  </div>
</div>

<!-- JavaScript at the bottom – no functions defined -->
<script src="index.js"></script>
</body>
</html>
