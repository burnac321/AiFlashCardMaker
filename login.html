<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Flash Cards AI Maker</title>
    <style>
        h1{
            text-align: center;
            margin-top: 50px;
            font-family: 'Times New Roman', Times, serif;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: left;
            margin-top: 30px;
            background: white;
            padding: 30px;
            width: 300px;
            height: auto;
            border-radius: 12px;
            border: 2px solid #00a88f;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
        color: #444;
        font-size: 14px;
        } 
        body {
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #00a88f;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }
        p{
        text-align: center;
        padding: 2px;
        }

    </style>
</head>
<body>
    <h1>Login to Flash Cards AI Maker</h1>
    <form action="/login" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="manzi425" required><br><br>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required><br><br>
        <button type="submit" onclick="window.location.href='dashboard/user-dashboard.html'">Login</button>
        <div class="login-link">
        <p>Already have an account? <a href="login.html" target="_blank">Login</a></p>
    </div>
    </form>
    <footer>
        &copy; 2024 Flash Card AI Maker. All rights reserved.
    </footer>
</body>
</html>
